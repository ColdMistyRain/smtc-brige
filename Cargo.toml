[package]
name = "smtc-brige"
version = "0.1.3"
edition = "2021"

[profile.release]
opt-level = "z"     # size-optimized（比 s 更小）
lto = true          
codegen-units = 1   
strip = true        
panic = "abort"     

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
axum = "0.8.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "gzip", "deflate", "native-tls"] }
regex = "1"
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
unicode-normalization = "0.1"
tower-http = { version = "0.7.0", features = ["cors"] }
async-trait = "0.1.92"
log = "0.4.33"
fern = "0.7.1"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Media_Control",
    "Storage_Streams",
    "Foundation",
    "Foundation_Collections",
] }# windows 0.62 将 `IAsyncOperation` 移入 windows-future crate（需与 windows 同系列的 0.3）
windows-future = "0.3"
# 在阻塞线程中驱动 WinRT 异步 Future（替代已移除的 `IAsyncOperation::get()`）
futures-lite = "2"
# 为阻塞等待 WinRT 异步操作提供可中断的定时器（避免损坏会话永久卡死线程）
futures-timer = "3"
[target.'cfg(windows)'.build-dependencies]
# 把版本/产品信息作为 VERSIONINFO 资源嵌入 Windows exe（见 build.rs）
winres = "0.1.12"
